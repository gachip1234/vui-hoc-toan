<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Vui Học Toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <a href="index.html" class="auth-container__back">⬅️ Quay về Trang Chủ</a>

      <form class="auth-form" id="registerForm">
        <h2 class="auth-form__title">Tạo Tài Khoản</h2>
        <p class="auth-form__subtitle">
          Tham gia cộng đồng toán học để nhận nhiều thử thách thú vị!
        </p>

        <div class="auth-form__group">
          <label for="fullName" class="auth-form__label"
            >Họ và tên của em</label
          >
          <input
            type="text"
            id="fullName"
            class="auth-form__input"
            placeholder="Ví dụ: Nguyễn Văn A"
          />
          <span class="auth-form__message"></span>
        </div>

        <div class="auth-form__group">
          <label for="email" class="auth-form__label">Địa chỉ Email</label>
          <input
            type="email"
            id="email"
            class="auth-form__input"
            placeholder="emhoc@toan.com"
          />
          <span class="auth-form__message"></span>
        </div>

        <div class="auth-form__group">
          <label for="password" class="auth-form__label"
            >Mật khẩu (Ít nhất 6 ký tự)</label
          >
          <input
            type="password"
            id="password"
            class="auth-form__input"
            placeholder="••••••••"
          />
          <span class="auth-form__message"></span>
        </div>

        <div class="auth-form__group">
          <label for="passwordConfirm" class="auth-form__label"
            >Nhập lại mật khẩu</label
          >
          <input
            type="password"
            id="passwordConfirm"
            class="auth-form__input"
            placeholder="••••••••"
          />
          <span class="auth-form__message"></span>
        </div>

        <button type="submit" class="btn btn--secondary auth-form__btn">
          Đăng Ký Ngay 🚀
        </button>

        <p class="auth-form__toggle-text">
          Em đã có tài khoản? <a href="login.html">Đăng nhập tại đây</a>
        </p>
      </form>
    </div>

    <script type="module">
      // 1. Nhập các hàm cần thiết từ CDN của Google (Sử dụng phiên bản 12.14.0 mới nhất)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

      // 2. DÁN ĐOẠN MÃ CẤU HÌNH CONFIG CỦA RIÊNG BẠN VÀO ĐÂY
      const firebaseConfig = {
        apiKey: "AIzaSyC-4jDOIiVbw1-Tvd1ClkazODngr6LCJ04",
        authDomain: "vuihoc-online.firebaseapp.com",
        projectId: "vuihoc-online",
        storageBucket: "vuihoc-online.firebasestorage.app",
        messagingSenderId: "218183563359",
        appId: "1:218183563359:web:3278515ee339fdb1a783ea",
      };

      // Khởi tạo ứng dụng Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // 3. LOGIC LẮNG NGHE FORM ĐĂNG KÝ
      const registerForm = document.getElementById("registerForm");
      const fullName = document.getElementById("fullName");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const passwordConfirm = document.getElementById("passwordConfirm");

      registerForm.addEventListener("submit", function (event) {
        event.preventDefault();

        // Kiểm tra hợp lệ form cơ bản
        if (
          fullName.value.trim() === "" ||
          email.value.trim() === "" ||
          password.value.length < 6
        ) {
          alert(
            "Em hãy điền đầy đủ thông tin và mật khẩu ít nhất 6 ký tự nhé!",
          );
          return;
        }

        if (password.value !== passwordConfirm.value) {
          alert("Mật khẩu nhập lại chưa trùng khớp em ơi!");
          return;
        }

        // Gọi lệnh của Google Firebase để tạo tài khoản lên Cloud
        createUserWithEmailAndPassword(auth, email.value.trim(), password.value)
          .then((userCredential) => {
            alert(
              `Chúc mừng ${fullName.value.trim()} đã tạo tài khoản thành công trên Google Cloud! 🎉🚀`,
            );

            // Lưu tạm tên hiển thị vào bộ nhớ để trang chủ nhận diện
            localStorage.setItem("hocSinhName", fullName.value.trim());

            registerForm.reset();
            window.location.href = "login.html"; // Chuyển sang trang đăng nhập
          })
          .catch((error) => {
            console.error(error);
            if (error.code === "auth/email-already-in-use") {
              alert("Email này đã được đăng ký trên hệ thống rồi em ơi!");
            } else {
              alert("Lỗi đăng ký: " + error.message);
            }
          });
      });
    </script>
  </body>
</html>
