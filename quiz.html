<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thử Thách Toán Học - Vui Học Toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"]], // Định dạng toán nằm trên cùng 1 dòng chữ
          displayMath: [["$$", "$$"]], // Định dạng toán nằm riêng biệt 1 dòng
        },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
    <style>
      .quiz-container {
        max-width: 700px;
        margin: 5rem auto;
        padding: 3rem;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .question-block {
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px dashed #edf2f7;
      }
      .question-text {
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: #2c3e50;
      }
      .options-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .option-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.2rem;
        border: 2px solid #edf2f7;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .option-item:hover {
        border-color: #3498db;
        background: #f4f9fc;
      }
      .option-item input {
        width: 1.8rem;
        height: 1.8rem;
        cursor: pointer;
      }
      .option-item label {
        width: 100%;
        cursor: pointer;
        font-size: 1.6rem;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container">
      <a
        href="index.html"
        style="
          text-decoration: none;
          color: #3498db;
          font-weight: 600;
          display: block;
          margin-bottom: 2rem;
        "
        >⬅️ Quay về Trang Chủ</a
      >

      <h2 style="font-size: 2.8rem; color: #2c3e50; margin-bottom: 1rem">
        📝 Thử Thách Toán Học Số 1
      </h2>
      <p style="color: #7f8c8d; margin-bottom: 3rem; font-size: 1.5rem">
        Em hãy suy nghĩ thật kỹ để hoàn thành 2 câu hỏi dưới đây nhé!
      </p>

      <form id="quizForm">
        <div class="question-block">
          <p class="question-text">Câu 1: Tìm $x$, biết: $2x + 5 = 15$</p>
          <ul class="options-list">
            <li class="option-item">
              <input type="radio" name="q1" id="q1_a" value="A" />
              <label for="q1_a">A. $x = 10$</label>
            </li>
            <li class="option-item">
              <input type="radio" name="q1" id="q1_b" value="B" />
              <label for="q1_b">B. $x = 5$</label>
            </li>
            <li class="option-item">
              <input type="radio" name="q1" id="q1_c" value="C" />
              <label for="q1_c">C. $x = 20$</label>
            </li>
          </ul>
        </div>

        <div class="question-block">
          <p class="question-text">
            Câu 2: Diện tích hình tam giác có đáy bằng 6cm và chiều cao bằng 4cm
            là bao nhiêu?
          </p>
          <ul class="options-list">
            <li class="option-item">
              <input type="radio" name="q2" id="q2_a" value="A" />
              <label for="q2_a">A. $12\text{ cm}^2$</label>
            </li>
            <li class="option-item">
              <input type="radio" name="q2" id="q2_b" value="B" />
              <label for="q2_b">B. $24\text{ cm}^2$</label>
            </li>
            <li class="option-item">
              <input type="radio" name="q2" id="q2_c" value="C" />
              <label for="q2_c">C. $10\text{ cm}^2$</label>
            </li>
          </ul>
        </div>

        <button
          type="submit"
          class="btn btn--primary"
          style="width: 100%; padding: 1.5rem; font-size: 1.6rem"
        >
          Nộp Bài Làm 🎯
        </button>
      </form>
    </div>

    <script src="/js/quiz.js"></script>
  </body>
</html>
