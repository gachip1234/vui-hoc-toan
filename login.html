<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Vui Học Toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <a href="index.html" class="auth-container__back">⬅️ Quay về Trang Chủ</a>

      <form class="auth-form" id="loginForm">
        <h2 class="auth-form__title">Đăng Nhập Học Viên</h2>
        <p class="auth-form__subtitle">
          Đăng nhập để tiếp tục chinh phục các đỉnh cao toán học!
        </p>

        <div class="auth-form__group">
          <label for="loginEmail" class="auth-form__label">Địa chỉ Email</label>
          <input
            type="email"
            id="loginEmail"
            class="auth-form__input"
            placeholder="emhoc@toan.com"
          />
          <span class="auth-form__message"></span>
        </div>

        <div class="auth-form__group">
          <label for="loginPassword" class="auth-form__label">Mật khẩu</label>
          <input
            type="password"
            id="loginPassword"
            class="auth-form__input"
            placeholder="••••••••"
          />
          <span class="auth-form__message"></span>
        </div>

        <button type="submit" class="btn btn--primary auth-form__btn">
          Đăng Nhập Thôi 🌟
        </button>

        <p class="auth-form__toggle-text">
          Em chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a>
        </p>
      </form>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

      // DÁN ĐOẠN MÃ CẤU HÌNH CONFIG CỦA BẠN VÀO ĐÂY (GIỐNG FILE REGISTER)
      const firebaseConfig = {
        apiKey: "AIzaSyC-4jDOIiVbw1-Tvd1ClkazODngr6LCJ04",
        authDomain: "vuihoc-online.firebaseapp.com",
        projectId: "vuihoc-online",
        storageBucket: "vuihoc-online.firebasestorage.app",
        messagingSenderId: "218183563359",
        appId: "1:218183563359:web:3278515ee339fdb1a783ea",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const loginForm = document.getElementById("loginForm");
      const loginEmail = document.getElementById("loginEmail");
      const loginPassword = document.getElementById("loginPassword");

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const emailValue = loginEmail.value.trim();
        const passwordValue = loginPassword.value;

        if (emailValue === "" || passwordValue === "") {
          alert("Em điền đầy đủ cả Email và Mật khẩu nhé!");
          return;
        }

        // Gọi lệnh xác thực đăng nhập của Google
        signInWithEmailAndPassword(auth, emailValue, passwordValue)
          .then((userCredential) => {
            alert("Đăng nhập lớp học toán thành công! 🎉🎒");

            // Vì Firebase Auth lưu user theo Email, tạm thời ta bốc phần chữ trước dấu @ làm tên chào mừng
            // (Sau này lên Firestore ta sẽ lưu chuẩn tên fullName riêng biệt sau)
            if (!localStorage.getItem("hocSinhName")) {
              const stubName = emailValue.split("@")[0];
              localStorage.setItem("hocSinhName", stubName);
            }

            window.location.href = "index.html"; // Quay về trang chủ
          })
          .catch((error) => {
            console.error(error);
            alert("Email hoặc Mật khẩu chưa đúng rồi kìa em ơi!");
          });
      });
    </script>
  </body>
</html>
