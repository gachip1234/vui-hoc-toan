<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vui Học Toán THCS - Chinh phục đỉnh cao tri thức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">📐 VUI HỌC TOÁN</a>

      <nav class="nav">
        <ul class="nav__list">
          <li><a href="#" class="nav__link">Bài Tập</a></li>
          <li><a href="#" class="nav__link">Thi Đấu</a></li>
          <li><a href="#" class="nav__link">Xếp Hạng</a></li>
        </ul>
      </nav>

      <div class="auth-buttons" id="authArea">
        <a href="/login.html" class="btn btn--outline">Đăng Nhập</a>
        <a href="/register.html" class="btn btn--primary">Đăng Ký</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero__content">
          <h1 class="hero__title">
            Chinh phục môn Toán <br />
            theo cách <span style="color: #3498db">thú vị nhất!</span>
          </h1>
          <p class="hero__desc">
            Hệ thống bài tập trực quan, giải đấu kịch tính dành riêng cho học
            sinh THCS giúp em không còn sợ Toán.
          </p>
          <div class="hero__actions">
            <a
              href="/quiz.html"
              class="btn btn--primary"
              style="padding: 1.5rem 4rem; font-size: 1.8rem"
              >Bắt Đầu Ngay 🚀</a
            >
          </div>
        </div>
        <div class="hero__image">
          <img
            src="https://img.freepik.com/free-vector/online-learning-concept-illustration_114360-1105.jpg"
            alt="Học toán online"
          />
        </div>
      </section>
      <section
        class="leaderboard-section"
        style="
          max-width: 600px;
          margin: 5rem auto;
          padding: 2rem;
          background: #fff;
          border-radius: 16px;
          box-shadow: var(--shadow);
        "
      >
        <h3
          style="
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
          "
        >
          🏆 Bảng Vàng Chăm Ngoan
        </h3>
        <table
          style="width: 100%; border-collapse: collapse; font-size: 1.6rem"
        >
          <thead>
            <tr
              style="
                border-bottom: 2px solid #edf2f7;
                text-align: left;
                color: #7f8c8d;
              "
            >
              <th style="padding: 1rem">Hạng</th>
              <th style="padding: 1rem">Họ Tên</th>
              <th style="padding: 1rem; text-align: right">Điểm Số</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </section>
      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import {
          getAuth,
          signOut,
          onAuthStateChanged,
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
          apiKey: "AIzaSyC-4jDOIiVbw1-Tvd1ClkazODngr6LCJ04",
          authDomain: "vuihoc-online.firebaseapp.com",
          projectId: "vuihoc-online",
          storageBucket: "vuihoc-online.firebasestorage.app",
          messagingSenderId: "218183563359",
          appId: "1:218183563359:web:3278515ee339fdb1a783ea",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Lắng nghe trạng thái đăng nhập từ Google Firebase
        onAuthStateChanged(auth, (user) => {
          const authArea = document.getElementById("authArea"); // ID vùng chứa các nút Đăng nhập/Đăng ký/Chào mừng

          if (user) {
            // Nếu học sinh đã đăng nhập thành công
            const tenHocSinh =
              localStorage.getItem("hocSinhName") || user.email.split("@")[0];

            authArea.innerHTML = `
                <div class="user-logged">
                    <span>👋 Chào em, <strong>${tenHocSinh}</strong>!</span>
                    <button id="logoutBtn" class="btn btn--outline" style="margin-left: 10px;">Đăng xuất</button>
                </div>
            `;

            // Bắt sự kiện nút Đăng xuất
            document
              .getElementById("logoutBtn")
              .addEventListener("click", () => {
                signOut(auth).then(() => {
                  localStorage.removeItem("hocSinhName");
                  alert("Đã đăng xuất tài khoản!");
                  window.location.reload();
                });
              });
          } else {
            // Nếu chưa đăng nhập, hiển thị lại 2 nút Đăng nhập / Đăng ký
            authArea.innerHTML = `
                <a href="/login.html" class="btn btn--outline">Đăng Nhập</a>
                <a href="/register.html" class="btn btn--primary">Đăng Ký</a>
            `;
          }
        });
      </script>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        orderBy,
        limit,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

      // DÁN ĐOẠN MÃ CẤU HÌNH CONFIG CỦA BẠN VÀO ĐÂY
      const firebaseConfig = {
        apiKey: "AIzaSyC-4jDOIiVbw1-Tvd1ClkazODngr6LCJ04",
        authDomain: "vuihoc-online.firebaseapp.com",
        projectId: "vuihoc-online",
        storageBucket: "vuihoc-online.firebasestorage.app",
        messagingSenderId: "218183563359",
        appId: "1:218183563359:web:3278515ee339fdb1a783ea",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // HÀM TỰ ĐỘNG LẤY TOP 5 ĐIỂM CAO NHẤT TỪ FIRESTORE
      async function taiBangXepHang() {
        const leaderboardBody = document.getElementById("leaderboardBody"); // Thay bằng ID thẻ chứa danh sách BXH của bạn
        if (!leaderboardBody) return;

        try {
          // Truy vấn lấy dữ liệu từ bảng "bang_diem", sắp xếp theo điểm giảm dần, giới hạn 5 người
          const q = query(
            collection(db, "bang_diem"),
            orderBy("score", "desc"),
            limit(5),
          );
          const querySnapshot = await getDocs(q);

          let html = "";
          let hang = 1;

          querySnapshot.forEach((doc) => {
            const data = doc.data();
            html += `
                  <tr>
                      <td>#${hang++}</td>
                      <td>${data.fullName}</td>
                      <td><span class="score-badge">${data.score} điểm</span></td>
                  </tr>
              `;
          });

          leaderboardBody.innerHTML =
            html ||
            "<tr><td colspan='3'>Chưa có học sinh nào nộp bài. Em hãy là người đầu tiên nhé!</td></tr>";
        } catch (error) {
          console.error("Lỗi tải BXH:", error);
        }
      }

      // Kích hoạt chạy hàm khi vừa load trang
      document.addEventListener("DOMContentLoaded", taiBangXepHang);
    </script>
  </body>
</html>
