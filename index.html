<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vui Học Toán THCS - Chinh phục đỉnh cao tri thức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">📐 VUI HỌC TOÁN</a>

      <nav class="nav">
        <ul class="nav__list">
          <li><a href="#" class="nav__link">Bài Tập</a></li>
          <li><a href="#" class="nav__link">Thi Đấu</a></li>
          <li><a href="#" class="nav__link">Xếp Hạng</a></li>
        </ul>
      </nav>

      <div class="auth-buttons" id="authArea">
        <a href="/auth.html" class="btn btn--outline">Đăng Nhập</a>
        <a href="/auth.html" class="btn btn--primary">Đăng Ký</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero__content">
          <h1 class="hero__title">
            Chinh phục môn Toán <br />
            theo cách <span style="color: #3498db">thú vị nhất!</span>
          </h1>
          <p class="hero__desc">
            Hệ thống bài tập trực quan, giải đấu kịch tính dành riêng cho học
            sinh THCS giúp em không còn sợ Toán.
          </p>
          <div class="hero__actions">
            <a
              href="/quiz.html"
              class="btn btn--primary"
              style="padding: 1.5rem 4rem; font-size: 1.8rem"
              >Bắt Đầu Ngay 🚀</a
            >
          </div>
        </div>
        <div class="hero__image">
          <img
            src="https://img.freepik.com/free-vector/online-learning-concept-illustration_114360-1105.jpg"
            alt="Học toán online"
          />
        </div>
      </section>
      <section
        class="leaderboard-section"
        style="
          max-width: 600px;
          margin: 5rem auto;
          padding: 2rem;
          background: #fff;
          border-radius: 16px;
          box-shadow: var(--shadow);
        "
      >
        <h3
          style="
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
          "
        >
          🏆 Bảng Vàng Chăm Ngoan
        </h3>
        <table
          style="width: 100%; border-collapse: collapse; font-size: 1.6rem"
        >
          <thead>
            <tr
              style="
                border-bottom: 2px solid #edf2f7;
                text-align: left;
                color: #7f8c8d;
              "
            >
              <th style="padding: 1rem">Hạng</th>
              <th style="padding: 1rem">Họ Tên</th>
              <th style="padding: 1rem; text-align: right">Điểm Số</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </section>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const tbody = document.getElementById("leaderboardBody");

          // Gọi API lấy bảng xếp hạng từ Server
          fetch("/api/leaderboard")
            .then((res) => res.json())
            .then((data) => {
              if (data.success && data.leaderboard.length > 0) {
                tbody.innerHTML = data.leaderboard
                  .map(
                    (student, index) => `
                        <tr style="border-bottom: 1px solid #edf2f7;">
                            <td style="padding: 1.2rem; font-weight: bold; color: ${index === 0 ? "#f1c40f" : "#2c3e50"}">#${index + 1}</td>
                            <td style="padding: 1.2rem;">${student.fullName}</td>
                            <td style="padding: 1.2rem; text-align: right; font-weight: 600; color: #2ecc71;">${student.score} điểm</td>
                        </tr>
                    `,
                  )
                  .join("");
              } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 2rem; color: #7f8c8d;">Chưa có học sinh nào nộp bài. Em hãy là người đầu tiên nhé!</td></tr>`;
              }
            });
        });
      </script>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const authArea = document.getElementById("authArea");

        // Kiểm tra xem trong "két sắt" có lưu tên học sinh nào không
        const tenHocSinh = localStorage.getItem("hocSinhName");

        if (tenHocSinh) {
          // Nếu CÓ học sinh đã đăng nhập: Xóa 2 nút cũ, thay bằng lời chào và nút Đăng xuất
          authArea.innerHTML = `
                <span style="font-weight: 600; margin-right: 15px; color: #2c3e50;">👋 Chào em, ${tenHocSinh}!</span>
                <button id="logoutBtn" class="btn btn--outline" style="padding: 0.6rem 1.5rem; font-size: 1.3rem;">Đăng xuất</button>
            `;

          // Lắng nghe sự kiện bấm nút Đăng xuất
          document
            .getElementById("logoutBtn")
            .addEventListener("click", function () {
              localStorage.removeItem("hocSinhName"); // Xóa tên khỏi két sắt
              window.location.reload(); // Tải lại trang để quay về trạng thái cũ
            });
        }
      });
    </script>
  </body>
</html>
